<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082b47">
  <title>{{PORTAL_COMPANY_NAME}} connected</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="hotspot-home">
  <main class="portal-shell">
    <div class="portal-stack">
      <header class="portal-header">
        <div class="portal-brand" aria-label="{{PORTAL_COMPANY_NAME}}"><span class="portal-mark" aria-hidden="true">L</span><span>{{PORTAL_COMPANY_NAME_MARKUP}}</span></div>
        <span class="network-status"><span class="online-dot"></span> HOTSPOT LOGIN</span>
      </header>
      <section class="welcome-panel">
        <p class="portal-kicker"><span class="online-dot"></span> CONNECTION ACTIVE</p>
        <h1>You are connected.</h1>
        <p>Your {{PORTAL_COMPANY_NAME}} Wi-Fi is ready.</p>
      </section>
      <section class="portal-state-panel">
        <a class="portal-button" href="$(link-redirect)">Continue browsing <span aria-hidden="true">&#8594;</span></a>
      </section>
      <footer class="portal-copyright" aria-label="Copyright">
        <span class="portal-copyright-text">© 2026 LKTECH™. All rights reserved.</span>
      </footer>
    </div>
  </main>
  <script>
    var billingBaseUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? window.location.origin
      : 'https://billing.lktech.life';
    document.documentElement.style.setProperty('--portal-wallpaper', 'url("' + billingBaseUrl + '/hotspot-assets/themes/savannah-background.png")');
    var bindUrl = billingBaseUrl + '/api/hotspot/roam';
    var bindBody = JSON.stringify({ username: '$(username)', mac: '$(mac)' });
    if (!navigator.sendBeacon || !navigator.sendBeacon(bindUrl, new Blob([bindBody], { type: 'text/plain' }))) {
      fetch(bindUrl, { method: 'POST', headers: { 'content-type': 'application/json' }, body: bindBody, keepalive: true }).catch(function () {});
    }
  </script>
</body>
</html>
