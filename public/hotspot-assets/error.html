<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7f6">
  <title>LKTech sign-in issue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-panel">
      <div class="portal-brand" aria-label="LKTech"><span class="portal-mark" aria-hidden="true">L</span><span>LKTECH</span></div>
      <p class="portal-kicker">SIGN-IN ISSUE</p>
      <h1>Let's try again.</h1>
      <p class="portal-error" role="alert">$(error)</p>
      <a class="portal-button" href="$(link-login)">Return to sign in <span aria-hidden="true">&#8594;</span></a>
      <p class="portal-footnote">Check your account details. If this continues, contact your network operator.</p>
    </section>
  </main>
</body>
</html>
