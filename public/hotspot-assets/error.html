<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in issue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-panel">
      <div class="portal-mark" aria-hidden="true">!</div>
      <p class="portal-kicker">SIGN-IN ISSUE</p>
      <h1>Could not connect</h1>
      <p class="portal-error" role="alert">$(error)</p>
      <a class="portal-button" href="$(link-login)">Try again</a>
      <p class="portal-footnote">If this continues, contact your network operator.</p>
    </section>
  </main>
</body>
</html>
