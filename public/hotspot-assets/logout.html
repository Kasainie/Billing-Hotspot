<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-panel">
      <div class="portal-mark" aria-hidden="true">N</div>
      <p class="portal-kicker">SUBSCRIBER NETWORK</p>
      <h1>You are signed out</h1>
      <p class="portal-copy">Your session has ended. Sign in again whenever you are ready.</p>
      <a class="portal-button" href="$(link-login)">Return to sign in</a>
      <p class="portal-footnote">Session time: $(uptime) · Data used: $(bytes-total-nice)</p>
    </section>
  </main>
</body>
</html>
