<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7f6">
  <title>LKTech signed out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-panel">
      <div class="portal-brand" aria-label="LKTech"><span class="portal-mark" aria-hidden="true">L</span><span>LKTECH</span></div>
      <p class="portal-kicker">SESSION ENDED</p>
      <h1>You are signed out.</h1>
      <p class="portal-copy">Your Wi-Fi session has ended. Sign in again whenever you are ready.</p>
      <a class="portal-button" href="$(link-login)">Sign in again <span aria-hidden="true">&#8594;</span></a>
      <p class="portal-footnote">Session time: $(uptime) · Data used: $(bytes-total-nice)</p>
    </section>
  </main>
</body>
</html>
